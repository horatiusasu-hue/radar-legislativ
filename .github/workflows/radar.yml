name: Radar transparenta ANAF
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - name: Ia codul
        uses: actions/checkout@v4
      - name: Pregateste Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instaleaza dependinte
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx openpyxl xlrd
          sudo apt-get update -qq
          sudo apt-get install -y -qq libreoffice-writer libreoffice-calc
      - name: Ruleaza radarul
        run: python radar_transparenta.py | tee rezultat.txt
      - name: Salveaza ce a gasit
        run: |
          if git diff --staged --quiet; then
            echo "Nimic nou."
          else
            git commit -m "Radar: proiecte noi"
            git push
          fi
      - name: Rezumat
        if: always()
        run: |
          echo "Radar transparenta ANAF" >> $GITHUB_STEP_SUMMARY
          cat rezultat.txt >> $GITHUB_STEP_SUMMARY
          git config user.name "Radar"
          git config user.email "radar@users.noreply.github.com"
          git add -A
